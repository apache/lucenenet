name: SonarCloud
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths: # Exclude anything that isn't the main solution (docs, images, website, etc.)
    - '.github/workflows/sonar.yml'
    - 'src/**'
    - '.build/dependencies.props'
    - '.build/TestReferences.Common.*'
    - '**/TestTargetFramework.*'
    - '*.sln'
    - '**/Directory.Build.*'
    - '!src/docs/**'
    - '!**/*.md'
    - '!**/*.txt'
  schedule:
    - cron: '36 12 * * *' # 12:36 PM UTC, daily (picked an odd start time to try to avoid competing for agents with other projects)
jobs:
  build:
    if: github.repository == 'apache/lucenenet' # Don't run on forks
    name: Build and analyze
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS: 'true'
    steps:
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '8.0.x'
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarCloud packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~\.sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = '.\.sonar\scanner'
          if (!(Test-Path $dir)) { New-Item -Path $dir -ItemType Directory }
          dotnet tool update dotnet-sonarscanner --tool-path $dir
      - name: Cache NuGet Packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # '**/*.*proj' includes .csproj, .vbproj, .fsproj, msbuildproj, etc.
          # '**/*.props' includes Directory.Packages.props, Directory.Build.props and Dependencies.props
          # '**/*.targets' includes Directory.Build.targets
          # '**/*.sln' and '*.sln' ensure root solution files are included (minimatch glitch for file extension .sln)
          # 'global.json' included for SDK version changes
          key: nuget-${{ runner.os }}-${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}-${{ hashFiles('**/*.*proj', '**/*.props', '**/*.targets', '**/*.sln', '*.sln', 'global.json') }}
          path: ${{ env.NUGET_PACKAGES }}
      - name: Restore dependencies
        run: dotnet restore /p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}
      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        shell: pwsh
        run: |
          # Use the most recent release tag (i.e. Lucene.Net_4_8_0_beta00018 -> 4.8.0-beta00018) as the project version
          # so the "previous version" new code period starts over after each release instead of growing indefinitely.
          $releaseTag = git tag --list 'Lucene.Net_*' --sort=-creatordate | Select-Object -First 1
          $projectVersion = ($releaseTag -replace '^Lucene\.Net_(\d+)_(\d+)_(\d+)_?', '$1.$2.$3-').TrimEnd('-')
          Write-Host "SonarCloud project version: $projectVersion"

          # Ignored rules:
          # e1 - S2328: GetHashCode() referencing mutable fields is inherent to Lucene's design (queries, attributes, *Ref types are mutable)
          # e2 - S1206: MutableValue subclasses inherit Equals() from MutableValue, which delegates to EqualsSameType(), as in Lucene
          # e3 - S3887: Public readonly arrays are part of the public API ported from Lucene
          # e4 - S7630: Azure Pipelines template parameters are supplied by our own pipeline definitions, not by untrusted users
          .\.sonar\scanner\dotnet-sonarscanner begin /k:"apache_lucenenet" /o:"apache" /v:"$projectVersion" `
            /d:sonar.token="${{ secrets.SONARCLOUD_TOKEN }}" /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.issue.ignore.multicriteria="e1,e2,e3,e4" `
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="csharpsquid:S2328" `
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="src/**/*.cs" `
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey="csharpsquid:S1206" `
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="src/Lucene.Net/Util/Mutable/*.cs" `
            /d:sonar.issue.ignore.multicriteria.e3.ruleKey="csharpsquid:S3887" `
            /d:sonar.issue.ignore.multicriteria.e3.resourceKey="src/**/*.cs" `
            /d:sonar.issue.ignore.multicriteria.e4.ruleKey="azurepipelines:S7630" `
            /d:sonar.issue.ignore.multicriteria.e4.resourceKey=".build/azure-templates/**"
          dotnet build --no-restore /p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}
          .\.sonar\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONARCLOUD_TOKEN }}"
