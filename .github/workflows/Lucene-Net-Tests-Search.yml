      - name: Test Lucene.Net.Tests.Highlighter
        run: dotnet test "./src/Lucene.Net.Tests.Highlighter/Lucene.Net.Tests.Highlighter.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-build --no-restore --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 20minutes --logger:"console;verbosity=normal" --logger:"trx;LogFileName=${{env.trx_file_name}}" --logger:"liquid.md;LogFileName=${{env.md_file_name}};Title=Test Results for Lucene.Net.Tests.Highlighter - ${{matrix.framework}} - ${{matrix.platform}} - ${{matrix.os}};" --results-directory:"${{github.workspace}}/${{env.test_results_artifact_name}}/Lucene.Net.Tests.Highlighter" -- RunConfiguration.TargetPlatform=${{matrix.platform}} NUnit.DisplayName=FullName TestRunParameters.Parameter\(name=\"tests:slow\",\ value=\"\${{env.run_slow_tests}}\"\)
        shell: bash
        if: ${{always() && steps.build_Lucene_Net_Tests_Highlighter.outcome == 'success'}}

