    - 'src/Lucene.Net.Tests.Spatial/**/*'
    - 'src/Lucene.Net.Tests.Suggest/**/*'
    - '.build/dependencies.props'
    - '.build/TestReferences.Common.*'
    - 'TestTargetFrameworks.*'
    - '.github/**/*.yml'
    - '*.sln'
    - 'src/Lucene.Net.Tests.Facet/Directory.Build.*'
    - 'src/Directory.Build.*'
    - 'Directory.Build.*'
    - 'src/Lucene.Net.Tests.Grouping/Directory.Build.*'
    - 'src/Lucene.Net.Tests.Highlighter/Directory.Build.*'
    - 'src/Lucene.Net.Tests.Join/Directory.Build.*'
    - 'src/Lucene.Net.Tests.Spatial/Directory.Build.*'
    - 'src/Lucene.Net.Tests.Suggest/Directory.Build.*'
    - 'src/Lucene.Net.Tests.Highlighter/PostingsHighlight/CambridgeMA.utf8'
    - 'src/Lucene.Net.Tests.Spatial/Test-Files/**/*'
    - 'src/Lucene.Net.Tests.Suggest/Suggest/Top50KWiki.utf8'

    # Dependencies
    - 'src/Lucene.Net/**/*'
    - 'src/Lucene.Net.Analysis.Common/**/*'
    - 'src/Lucene.Net.Codecs/**/*'
    - 'src/Lucene.Net.Queries/**/*'
    - 'src/Lucene.Net.Grouping/**/*'
    - 'src/Lucene.Net.Join/**/*'
    - 'src/Lucene.Net.Facet/**/*'
    - 'src/Lucene.Net.TestFramework/**/*'
    - 'src/Lucene.Net.Memory/**/*'
    - 'src/Lucene.Net.Highlighter/**/*'
    - 'src/Lucene.Net.Spatial/**/*'
    - 'src/Lucene.Net.Misc/**/*'
    - 'src/Lucene.Net.Suggest/**/*'

    - '!**/*.md'

jobs:

  Test:
    runs-on: ${{ matrix.os }}
    # Without this, a job inherits the GitHub default of 360 minutes. The slowest job
    # observed takes well under 30 minutes, grouped ones included, so this is a cap on a
    # stuck job rather than a budget to run within.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        framework: [net10.0, net8.0, net48, net472]
        platform: [x64]
        configuration: [Release]
        exclude:
          - os: ubuntu-latest
            framework: net48
          - os: ubuntu-latest
            framework: net472
          - os: macos-latest
            framework: net48
          - os: macos-latest
            framework: net472
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS: 'true'
      run_slow_tests: 'false'
      trx_file_name: 'TestResults.trx'
      md_file_name: 'TestResults.md' # Report file name for LiquidTestReports.Markdown

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '8.0.x'
        if: ${{ startswith(matrix.framework, 'net8.') }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # '**/*.*proj' includes .csproj, .vbproj, .fsproj, msbuildproj, etc.
          # '**/*.props' includes Directory.Packages.props, Directory.Build.props and Dependencies.props
          # '**/*.targets' includes Directory.Build.targets
          # '**/*.sln' and '*.sln' ensure root solution files are included (minimatch glitch for file extension .sln)
          # 'global.json' included for SDK version changes
          key: nuget-${{ runner.os }}-${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}-${{ hashFiles('**/*.*proj', '**/*.props', '**/*.targets', '**/*.sln', '*.sln', 'global.json') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Restore
        run: dotnet restore /p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}

      - name: Setup Environment Variables
        run: |
          $test_results_artifact_name = "testresults_${{matrix.os}}_${{matrix.framework}}_${{matrix.platform}}_${{matrix.configuration}}"
          $working_directory = "$env:GITHUB_WORKSPACE"
          Write-Host "Results Artifact Name: $test_results_artifact_name"
          Write-Host "Working Directory: $working_directory"
          echo "test_results_artifact_name=$test_results_artifact_name" | Out-File -FilePath  $env:GITHUB_ENV -Encoding utf8 -Append
          # Set the Azure DevOps default working directory env variable, so our tests only need to deal with a single env variable
          echo "SYSTEM_DEFAULTWORKINGDIRECTORY=$working_directory" | Out-File -FilePath  $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      # Lucene.Net.Tests.Facet
      - name: Build Lucene.Net.Tests.Facet
        id: build_Lucene_Net_Tests_Facet
        run: dotnet build "./src/Lucene.Net.Tests.Facet/Lucene.Net.Tests.Facet.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-restore -p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}
        shell: bash
      - name: Test Lucene.Net.Tests.Facet
        run: dotnet test "./src/Lucene.Net.Tests.Facet/Lucene.Net.Tests.Facet.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-build --no-restore --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 20minutes --logger:"console;verbosity=normal" --logger:"trx;LogFileName=${{env.trx_file_name}}" --logger:"liquid.md;LogFileName=${{env.md_file_name}};Title=Test Results for Lucene.Net.Tests.Facet - ${{matrix.framework}} - ${{matrix.platform}} - ${{matrix.os}};" --results-directory:"${{github.workspace}}/${{env.test_results_artifact_name}}/Lucene.Net.Tests.Facet" -- RunConfiguration.TargetPlatform=${{matrix.platform}} NUnit.DisplayName=FullName TestRunParameters.Parameter\(name=\"tests:slow\",\ value=\"\${{env.run_slow_tests}}\"\)
        shell: bash
        if: ${{always() && steps.build_Lucene_Net_Tests_Facet.outcome == 'success'}}

      # Lucene.Net.Tests.Grouping
      - name: Build Lucene.Net.Tests.Grouping
        id: build_Lucene_Net_Tests_Grouping
        run: dotnet build "./src/Lucene.Net.Tests.Grouping/Lucene.Net.Tests.Grouping.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-restore -p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}
        shell: bash
        if: ${{always()}}
      - name: Test Lucene.Net.Tests.Grouping
        run: dotnet test "./src/Lucene.Net.Tests.Grouping/Lucene.Net.Tests.Grouping.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-build --no-restore --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 20minutes --logger:"console;verbosity=normal" --logger:"trx;LogFileName=${{env.trx_file_name}}" --logger:"liquid.md;LogFileName=${{env.md_file_name}};Title=Test Results for Lucene.Net.Tests.Grouping - ${{matrix.framework}} - ${{matrix.platform}} - ${{matrix.os}};" --results-directory:"${{github.workspace}}/${{env.test_results_artifact_name}}/Lucene.Net.Tests.Grouping" -- RunConfiguration.TargetPlatform=${{matrix.platform}} NUnit.DisplayName=FullName TestRunParameters.Parameter\(name=\"tests:slow\",\ value=\"\${{env.run_slow_tests}}\"\)
        shell: bash
        if: ${{always() && steps.build_Lucene_Net_Tests_Grouping.outcome == 'success'}}

      # Lucene.Net.Tests.Highlighter
      - name: Build Lucene.Net.Tests.Highlighter
        id: build_Lucene_Net_Tests_Highlighter
        run: dotnet build "./src/Lucene.Net.Tests.Highlighter/Lucene.Net.Tests.Highlighter.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-restore -p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}
