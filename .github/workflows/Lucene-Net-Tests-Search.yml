        shell: bash
        if: ${{always() && steps.build_Lucene_Net_Tests_Join.outcome == 'success'}}

      # Lucene.Net.Tests.Spatial
      - name: Build Lucene.Net.Tests.Spatial
        id: build_Lucene_Net_Tests_Spatial
        run: dotnet build "./src/Lucene.Net.Tests.Spatial/Lucene.Net.Tests.Spatial.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-restore -p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}
        shell: bash
        if: ${{always()}}
      - name: Test Lucene.Net.Tests.Spatial
        run: dotnet test "./src/Lucene.Net.Tests.Spatial/Lucene.Net.Tests.Spatial.csproj" --configuration "${{matrix.configuration}}" --framework "${{matrix.framework}}" --no-build --no-restore --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 20minutes --logger:"console;verbosity=normal" --logger:"trx;LogFileName=${{env.trx_file_name}}" --logger:"liquid.md;LogFileName=${{env.md_file_name}};Title=Test Results for Lucene.Net.Tests.Spatial - ${{matrix.framework}} - ${{matrix.platform}} - ${{matrix.os}};" --results-directory:"${{github.workspace}}/${{env.test_results_artifact_name}}/Lucene.Net.Tests.Spatial" -- RunConfiguration.TargetPlatform=${{matrix.platform}} NUnit.DisplayName=FullName TestRunParameters.Parameter\(name=\"tests:slow\",\ value=\"\${{env.run_slow_tests}}\"\)
